---
name: Update pins

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Update nixpkgs-lock
        run: nix flake update nixpkgs-lock
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update nixpkgs pin"
          title: "chore: update nixpkgs pin"
          body: "Automated update of the nixpkgs-lock flake input."
          branch: automation/update-nixpkgs-lock
